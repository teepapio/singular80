<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Singular 80 · Dashboard</title>
    <!--
      Nur noch für alte Links: Das Dashboard liegt jetzt unter `/`, und das ist
      auch das, was der Starter und die Verknüpfung öffnen. Diese Seite hängt
      hier, weil in Lesezeichen, Discord-Nachrichten und alten Screenshots noch
      `/dashboard.html` steht — ein toter 404 wäre eine Regression, die niemand
      braucht. Wer sie sieht, wird weitergeleitet und hat sie danach nie wieder.

      `location.replace` statt `<meta http-equiv="refresh">`: Vite löst die URL
      eines Meta-Refresh beim Bau als Asset auf, und `/` ist ein Verzeichnis —
      der Build bricht dann mit EISDIR ab.
    -->
    <script>
      location.replace('/');
    </script>
  </head>
  <body>
    <p>Das Dashboard ist umgezogen. <a href="/">Hier geht es weiter.</a></p>
  </body>
</html>
