<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Singular 80 · Dashboard</title>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">◆</span>
        <div>
          <h1>Singular 80</h1>
          <p>Spieler-Vorschläge · priorisiert · ein Klick zur Umsetzung</p>
        </div>
      </div>
      <div class="topbar-actions">
        <span id="connection" class="connection offline"><span class="dot"></span> getrennt</span>
        <button id="reload-content" class="ghost" title="Content-Dateien neu einlesen">⟳ Content</button>
        <button id="open-settings" class="ghost">⚙ Einstellungen</button>
        <a class="ghost" href="/" target="_blank" rel="noreferrer">▶ Zum Spiel</a>
      </div>
    </header>

    <section class="stats" id="stats"></section>

    <section class="toolbar">
      <nav class="tabs" id="tabs">
        <button data-tab="queue" class="active">🚀 Queue</button>
        <button data-tab="new">🆕 Neu</button>
        <button data-tab="top">🏆 Top</button>
        <button data-tab="cluster">🧩 Cluster</button>
        <button data-tab="done">✅ Erledigt</button>
      </nav>
      <div class="filters">
        <input id="search" type="search" placeholder="Suchen …" />
        <div class="chips" id="categories"></div>
      </div>
    </section>

    <main class="layout">
      <section class="list-panel">
        <div id="list" class="list"></div>
        <div id="empty" class="empty" hidden>Keine Vorschläge in dieser Ansicht.</div>
      </section>

      <aside class="run-panel">
        <div class="panel-header">
          <h2>OpenCode Runs</h2>
          <div class="panel-header-actions">
            <button id="cleanup-runs" class="ghost small" title="Runs aufräumen, deren Prozess nicht mehr läuft">🧹</button>
            <button id="refresh-runs" class="ghost small" title="Aktualisieren">⟳</button>
          </div>
        </div>
        <div id="active-run" class="active-run"></div>
        <div id="run-history" class="run-history"></div>
      </aside>
    </main>

    <dialog id="settings-dialog">
      <form method="dialog" class="settings-form">
        <h2>Einstellungen</h2>
        <label>Discord-Webhook-URL
          <input id="setting-webhook" type="text" placeholder="https://discord.com/api/webhooks/…" />
          <small id="webhook-state"></small>
        </label>
        <label>Modell für Runs (leer = Standard)
          <input id="setting-model" type="text" placeholder="z. B. opencode-go/deepseek-v4.1-flash" />
        </label>
        <label>Zusätzliche Anweisungen für den Umsetzungs-Agenten
          <textarea id="setting-instructions" rows="3"></textarea>
        </label>
        <label class="row">
          <input id="setting-autoapprove" type="checkbox" />
          Auto-Genehmigung ab Score
          <input id="setting-autoscore" type="number" min="0" max="200" step="1" class="number" />
        </label>
        <div class="settings-actions">
          <button type="button" id="test-webhook" class="ghost">Testnachricht senden</button>
          <button type="button" id="save-settings" class="primary">Speichern</button>
          <button type="button" id="close-settings" class="ghost">Schließen</button>
        </div>
      </form>
    </dialog>

    <dialog id="split-dialog">
      <form method="dialog" class="settings-form">
        <h2>Auftrag aufteilen</h2>
        <p id="split-parent" class="split-parent"></p>
        <label>Einzelaufträge — eine Zeile pro Auftrag
          <textarea id="split-tasks" rows="8" spellcheck="false"></textarea>
        </label>
        <small id="split-count" class="split-count"></small>
        <div class="settings-actions">
          <button type="button" id="split-auto" class="ghost">🤖 Automatisch aufteilen</button>
          <button type="button" id="split-cancel" class="ghost">Abbrechen</button>
          <button type="button" id="split-create" class="primary">Aufträge anlegen</button>
        </div>
      </form>
    </dialog>

    <div id="toasts" class="toasts"></div>
    <script type="module" src="/src/dashboard/main.ts"></script>
  </body>
</html>
