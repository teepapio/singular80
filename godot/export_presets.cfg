; Godot 4.5 export presets for Singular 80.
;
; Only one target is shipped: a signed APK for real Android phones and tablets
; (arm64-v8a, Android 7.0 / API 24 and newer). Re-enable `x86_64` in the
; architectures block if you want to install on an emulator instead.
;
; The release build is signed with Godot's auto-generated debug keystore
; (~/.android/debug.keystore) so the repository stays free of secrets and every
; machine can reproduce the same artifact. Replace `keystore/release*` with your
; own keystore before publishing to a store.

[preset.0]

name="Android"
platform="Android"
runnable=true
advanced_options=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
; `.json` wird nicht importiert und landet sonst nicht im Paket — ohne
; `assets/meshes/lod.json` zeigt die Galerie keine Dreieckzahlen.
include_filter="*.json"
; `_*` fängt die Wegwerf-Harness-Skripte ab, die beim Debuggen im Projekt landen.
exclude_filter="tests/*, shot.gd, shot.tscn, probe.gd, _*, android/build/*, build/*"
export_path="/home/edi/singular80/build/singular80.apk"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

